name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Protocol boundaries and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --extra test
      - name: Exercise request and protocol boundaries
        run: uv run --locked pytest -q
      - name: Build installable distribution
        run: uv build
      - name: Install wheel and inspect CLI
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/acp-bridge-install"
          uv pip install --python "$RUNNER_TEMP/acp-bridge-install/bin/python" dist/*.whl
          "$RUNNER_TEMP/acp-bridge-install/bin/acp-bridge" --help
      - name: Preserve package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build locked non-root image
        run: docker build --tag acp-bridge:ci .
